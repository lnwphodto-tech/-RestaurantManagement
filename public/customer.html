<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant</title><link rel="stylesheet" href="/style.css"></head><body><header><h1 id="name">Restaurant</h1><span id="tag"></span></header><main><div class="grid"><section class="card"><h2>จองโต๊ะ / บัตร</h2><form id="booking"><input name="name" placeholder="ชื่อผู้จอง" required><input name="date" type="date" required><label>เลือกโต๊ะ</label><div class="floor" id="floor"></div><input type="hidden" name="tableId" required><label><input name="ageConfirmed" type="checkbox" required> ฉันยืนยันว่าอายุถึงเกณฑ์</label><button>สร้าง E-Ticket (Demo)</button></form><p class="status" id="bookStatus"></p></section><section class="card"><h2>สั่งอาหารจากโต๊ะ</h2><form id="order"><select name="tableId" id="orderTable" required></select><div id="menu"></div><button>ส่งเข้าครัว</button></form><p class="status" id="orderStatus"></p></section><section class="card"><h2>เข้าคิวหน้าร้าน</h2><form id="queue"><input name="name" placeholder="ชื่อ" required><input name="guests" type="number" min="1" value="2"><button>รับบัตรคิว</button></form><p class="status" id="queueStatus"></p><h2>ส่งขึ้นจอทีวี</h2><form id="post"><input name="tableId" placeholder="โต๊ะ (ถ้ามี)"><textarea name="text" placeholder="ข้อความของคุณ"></textarea><input name="imageUrl" placeholder="ลิงก์รูปภาพ (ไม่บังคับ)"><button>ส่งให้แอดมินอนุมัติ</button></form></section></div></main><script type="module">
import{api,money,watch}from'/app.js';let state;async function render(){state=await api('/api/public');name.textContent=state.config.name;tag.textContent=state.config.tagline;floor.innerHTML='';orderTable.innerHTML='<option value="">เลือกโต๊ะ</option>';state.tables.forEach(t=>{orderTable.innerHTML+=`<option value="${t.id}">${t.name}</option>`;const b=document.createElement('button');b.className='table '+(t.status==='available'?'':'busy');b.style.cssText=`left:${t.x}%;top:${t.y}%`;b.disabled=t.status!=='available';b.textContent=`${t.name} (${t.seats})`;b.onclick=e=>{e.preventDefault();booking.tableId.value=t.id;[...floor.children].forEach(x=>x.style.outline='');b.style.outline='3px solid #e94560';};floor.append(b)});menu.innerHTML=state.menu.map(m=>`<label><input type="number" min="0" value="0" data-id="${m.id}"> ${m.name} — ${money(m.price)}</label>`).join('');}render();watch(render);
booking.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(booking);const table=state.tables.find(t=>t.id===f.get('tableId'));const event=state.events.find(x=>x.date===f.get('date'));const r=await api('/api/reservations',{method:'POST',body:JSON.stringify({name:f.get('name'),date:f.get('date'),tableId:f.get('tableId'),ageConfirmed:f.get('ageConfirmed')==='on',deposit:event?.deposit||0})});bookStatus.textContent=`E-Ticket: ${r.reservation.code} | มัดจำ ${money(r.payment.amount)} (โหมดสาธิต)`}catch(x){bookStatus.textContent=x.message}};
order.onsubmit=async e=>{e.preventDefault();const items=[...menu.querySelectorAll('input')].filter(x=>+x.value).map(x=>({menuId:x.dataset.id,qty:+x.value}));try{const r=await api('/api/orders',{method:'POST',body:JSON.stringify({tableId:orderTable.value,items})});orderStatus.textContent=`ส่งออเดอร์ ${r.id} ยอด ${money(r.total)}`}catch(x){orderStatus.textContent=x.message}};queue.onsubmit=async e=>{e.preventDefault();const f=new FormData(queue);const r=await api('/api/queue',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});queueStatus.textContent=`คิวของคุณ: ${r.number}`};post.onsubmit=async e=>{e.preventDefault();try{await api('/api/posts',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(post)))});post.reset();alert('ส่งรออนุมัติแล้ว')}catch(x){alert(x.message)}};
</script></body></html>
