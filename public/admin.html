<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Admin Console</h1></header><main><p><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">เข้าสู่ระบบ</button></p><div id="app"></div></main><script type="module">import{api,money,watch}from'/app.js';let d;const auth=()=>({'x-admin-token':token.value});async function render(){try{d=await api('/api/admin',{headers:auth()});app.innerHTML=`<div class="grid"><section class="card"><h2>คิว</h2><button id="next">เรียกคิวถัดไป</button>${d.queue.map(q=>`<p>#${q.number} ${q.name} — ${q.status}</p>`).join('')}</section><section class="card"><h2>โต๊ะ</h2>${d.tables.map(t=>`<p>${t.name}: <select data-table="${t.id}"><option ${t.status==='available'?'selected':''}>available</option><option ${t.status==='reserved'?'selected':''}>reserved</option><option ${t.status==='occupied'?'selected':''}>occupied</option></select></p>`).join('')}</section><section class="card"><h2>เมนู</h2>${d.menu.map(m=>`<p>${m.name} ${money(m.price)} <button data-menu="${m.id}" data-active="${!m.available}">${m.available?'Sold out':'Restore'}</button></p>`).join('')}<form id="newMenu"><input name="name" placeholder="ชื่อเมนู" required><input name="price" type="number" placeholder="ราคา" required><button>เพิ่มเมนู</button></form></section><section class="card"><h2>อนุมัติข้อความ/รูป</h2>${d.posts.map(p=>`<p>${p.text||'[รูปภาพ]'} — ${p.status} ${p.status==='pending'?`<button data-post="${p.id}">อนุมัติ</button>`:''}</p>`).join('')}</section></div>`;next.onclick=()=>api('/api/admin/queue/next',{method:'POST',headers:auth()}).then(render);document.querySelectorAll('[data-table]').forEach(x=>x.onchange=()=>api('/api/admin/tables/'+x.dataset.table,{method:'PATCH',headers:auth(),body:JSON.stringify({status:x.value})}).then(render));document.querySelectorAll('[data-menu]').forEach(x=>x.onclick=()=>api('/api/admin/menu/'+x.dataset.menu,{method:'PATCH',headers:auth(),body:JSON.stringify({available:x.dataset.active==='true'})}).then(render));document.querySelectorAll('[data-post]').forEach(x=>x.onclick=()=>api('/api/admin/posts/'+x.dataset.post,{method:'PATCH',headers:auth(),body:JSON.stringify({status:'approved'})}).then(render));newMenu.onsubmit=e=>{e.preventDefault();api('/api/admin/menu',{method:'POST',headers:auth(),body:JSON.stringify(Object.fromEntries(new FormData(newMenu)))}).then(render)}}catch(e){app.innerHTML='<p class="status">'+e.message+'</p>'}}load.onclick=render;watch(()=>token.value&&render());</script></body></html>
