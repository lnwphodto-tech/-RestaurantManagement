<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDS</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Kitchen Display System</h1><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="go">โหลด</button></header><main id="app" class="grid"></main><script type="module">import{api,watch}from'/app.js';async function render(){if(!token.value)return;try{let d=await api('/api/admin',{headers:{'x-admin-token':token.value}});app.innerHTML=d.orders.map(o=>`<section class="card"><h2>${o.tableId} · ${o.status}</h2>${o.items.map(i=>`<p>${i.menuId} × ${i.qty}</p>`).join('')}<select data-id="${o.id}"><option>pending</option><option>cooking</option><option>served</option></select></section>`).join('')||'<p>ยังไม่มีออเดอร์</p>';document.querySelectorAll('select').forEach(s=>{s.value=d.orders.find(o=>o.id===s.dataset.id).status;s.onchange=()=>api('/api/admin/orders/'+s.dataset.id,{method:'PATCH',headers:{'x-admin-token':token.value},body:JSON.stringify({status:s.value})}).then(render)})}catch(e){app.textContent=e.message}}go.onclick=render;watch(render);</script></body></html>
