<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Signage</title><link rel="stylesheet" href="/style.css"></head><body class="tv"><header><h1 id="name">Restaurant</h1></header><main><div class="grid"><section><h2>กำลังเรียกคิว</h2><div class="big" id="current">—</div><h2>คิวถัดไป</h2><div class="queue" id="next">—</div></section><section><h2>โปรโมชั่น</h2><div id="slides"></div></section></div><h2>ร่วมสนุกคืนนี้</h2><div id="posts" class="posts"></div></main><script type="module">import{api,watch}from'/app.js';async function render(){const d=await api('/api/public');name.textContent=d.config.name;const q=d.queue;current.textContent=q[0]?`#${q[0].number}`:'—';next.textContent=q.slice(1,4).map(x=>'#'+x.number).join('  ')||'—';slides.innerHTML=d.slides.map(s=>`<div class="card"><h2>${s.title}</h2>${s.image?`<img src="${s.image}" alt="slide">`:''}</div>`).join('');posts.innerHTML=d.posts.map(p=>`<article class="post">${p.imageUrl?`<img src="${p.imageUrl}">`:''}<p>${p.text}</p></article>`).join('')}render();watch(render);</script></body></html>
